# DATA_SOURCES.yaml - provenance and licence manifest
generated_by: show-me-org attribution pass, 2026-08-30
licences_verified_at_source: 2026-08-30
repository: https://github.com/celnicconsulting/mid_range_org
note: >
  This repository publishes derived artefacts only (the extracts the app
  reads). The raw downloads and staging tables named under upstream_files live
  in the private working tree and are not redistributed here.

  Every dataset below is registered in scripts/org_sources.py in the working
  tree; the id used here is that registry's dataset_id, so a row can be traced
  to the packet section it came from.

  On 2026-08-30 every licence in this file was checked online against the
  publisher's own pages and, where one exists, the dataset's own data.govt.nz
  catalogue record. `licence_basis` records WHERE the claim comes from and
  `licence_evidence` records the URL it was read at, because the distinction
  between a licence read off a dataset's own record and one inherited from an
  agency-wide statement is the whole point of this manifest. Nothing here is
  inherited from the build's internal registry any more.

  A single file, data/mid_range_org_public.duckdb, carries every derived
  artefact. `tables` names the tables inside it that a dataset feeds, so the
  file-level mapping stays honest at table grain.

  `publisher` is the agency that actually published the data, which is not
  always the agency whose work packet asked for it: six datasets registered
  under Customs, LINZ, MfE and Health are published by Stats NZ. Attribution
  follows the publisher, and `registered_under` records the packet.

licence_basis_values:
  dataset_page: >
    read from this dataset's own source page or its own data.govt.nz catalogue
    record (CKAN licence_id), on the date above
  agency_record: >
    only an agency-wide or site-wide licensing statement was found and read;
    no statement specific to this dataset exists or could be reached
  unverified: >
    no licence could be established - the page was unreachable, blocked, or
    carried no statement

licence_issue_rule: >
  licence_issue is true unless licence_basis is dataset_page AND the licence is
  a clean attribution licence (CC BY 4.0, CC BY 4.0 NZ, CC BY 3.0 NZ,
  CC BY-SA 4.0). A true flag on an agency_record row is a statement about the
  strength of the evidence, not a doubt about the licence itself.

portal_terms_note: >
  Three sources were downloaded through API-key-gated portals. For those,
  `portal_terms` answers a question the licence does not: whether the portal's
  own terms of use permit redistribution of derived extracts. All three were
  checked and all three permit it - see the individual entries.

