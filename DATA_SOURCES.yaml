# DATA_SOURCES.yaml - provenance and licence manifest
generated_by: show-me-org attribution pass, 2026-08-30
repository: https://github.com/celnicconsulting/mid_range_org
note: >
  This repository publishes derived artefacts only (the extracts the app
  reads). The raw downloads and staging tables named under upstream_files live
  in the private working tree and are not redistributed here.

  Every dataset below is registered in scripts/org_sources.py in the working
  tree; the id used here is that registry's dataset_id, so a row can be traced
  to the packet section it came from. `licence_basis` records WHERE the licence
  claim comes from, because the distinction between a licence read off a
  dataset's own page and one inherited from an agency-level note is the whole
  point of this manifest.

  A single file, data/mid_range_org_public.duckdb, carries every derived
  artefact. `tables` names the tables inside it that a dataset feeds, so the
  file-level mapping stays honest at table grain.

  `publisher` is the agency that actually published the data, which is not
  always the agency whose work packet asked for it: six datasets registered
  under Customs, LINZ, MfE and Health are published by Stats NZ. Attribution
  follows the publisher, and `registered_under` records the packet.

licence_basis_values:
  dataset_page: licence stated for this dataset in the records held in this build
  agency_record: >
    inherited from the agency-level licence field in scripts/org_sources.py
    ORGS and design/org_register.md. Not confirmed against this dataset's own
    source page during the build.
  unverified: no licence statement for this dataset is recorded anywhere in this build

